[package]
name = "video-clip-trimmer"
version = "0.2.0"
edition = "2021"
description = "A simple yet useful program to trim and merge video clips."
license = "MIT"

[[bin]]
name = "video-clip-trimmer"
path = "src/main.rs"

[dependencies]
# egui 0.31 is what egui-miniquad 0.16 speaks. Immediate-mode UI, same on
# Windows, macOS, and Linux, and small enough to read in an afternoon.
egui = "0.31"
egui-miniquad = "0.16"
# miniquad opens a real OS window and draws with OpenGL. It does not use a
# browser or a webview.
miniquad = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Native save/open dialogs: Win32, Cocoa, and the Linux desktop portal.
# GTK is intentionally off so Linux builds do not need libgtk headers.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[profile.release]
lto = "thin"
strip = true
opt-level = 2
