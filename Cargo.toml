[package]
name = "video-clip-trimmer"
version = "0.4.1"
edition = "2024"
description = "A simple yet useful program to trim and merge video clips."
license = "MIT"

build = "build.rs"

[[bin]]
name = "video-clip-trimmer"
path = "src/main.rs"

[dependencies]
egui = "0.31"
egui-miniquad = "0.16"
miniquad = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
libloading = "0.8"

[build-dependencies]
embed-resource = "3"

[profile.release]
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 1
opt-level = 3
strip = true
lto = "thin"
panic = "abort"

[profile.release.package."*"]
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 1
opt-level = 3
strip = true
