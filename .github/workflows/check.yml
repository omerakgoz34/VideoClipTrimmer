name: Rust Check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Show the compiler version
        run: rustc --version
      - name: Check
        run: cargo check --locked
